<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F6FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14131F" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // apply a saved light or dark choice before the first paint, so the page never flashes
      try {
        var saved = localStorage.getItem("just-guessing.theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.dataset.theme = saved;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute("content", saved === "dark" ? "#14131F" : "#F4F6FB"); });
        }
      } catch (e) {}
    </script>
    <title>Just Guessing</title>
    <meta name="description" content="Race a language model at guessing the next word. It runs in your browser and shows you its odds." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
